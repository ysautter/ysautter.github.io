<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="sh-title sh-desc" class="selfhost-diagram">
  <title id="sh-title">Self-hosted setup</title>
  <desc id="sh-desc">All public traffic enters through one VPS. An SNI router sends mail to Stalwart and everything else to nginx-proxy. nginx-proxy serves local containers or forwards through a Tailscale gateway over WireGuard to the home lab, where every app runs with its own Tailscale sidecar. Immich photos are backed up nightly with restic to a separate disk.</desc>
  <defs>
    <marker id="sh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b9bb0"/></marker>
    <marker id="sh-a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f59e0b"/></marker>
    <marker id="sh-a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4CADAD"/></marker>
    <style>
      .selfhost-diagram text { font-family: Arial, sans-serif; fill: #fff; }
      .selfhost-diagram .mono { font-family: "Source Code Pro", ui-monospace, monospace; }
      .selfhost-diagram .t  { font-size: 14px; font-weight: 700; }
      .selfhost-diagram .h  { font-size: 16px; font-weight: 700; }
      .selfhost-diagram .s  { font-size: 11px; fill: rgba(255,255,255,.62); }
      .selfhost-diagram .c  { font-size: 12px; fill: rgba(255,255,255,.9); }
      .selfhost-diagram .l  { font-size: 10px; fill: rgba(255,255,255,.55); }
      .selfhost-diagram .b  { font-size: 11px; font-weight: 700; fill: #0d2136; }
      .selfhost-diagram .node  { fill: #13304d; stroke: rgba(255,255,255,.2); stroke-width: 1; }
      .selfhost-diagram .chip  { fill: rgba(255,255,255,.05); stroke: rgba(255,255,255,.16); stroke-width: 1; }
      .selfhost-diagram .ln    { fill: none; stroke: #8b9bb0; stroke-width: 1.6; marker-end: url(#sh-a); }
      .selfhost-diagram .ln-amber { fill: none; stroke: #f59e0b; stroke-width: 2.2; marker-end: url(#sh-a-amber); }
      .selfhost-diagram .ln-teal  { fill: none; stroke: #4CADAD; stroke-width: 1.8; marker-end: url(#sh-a-teal); }
    </style>
  </defs>

  <!-- ── Internet ─────────────────────────────────────────── -->
  <text x="74" y="48" text-anchor="middle" class="h mono">Internet</text>
  <rect x="12" y="110" width="124" height="34" rx="17" class="chip"/>
  <text x="74" y="131" text-anchor="middle" class="c">Browsers</text>
  <rect x="12" y="152" width="124" height="34" rx="17" class="chip" style="stroke:#f59e0b"/>
  <text x="74" y="173" text-anchor="middle" class="c">Phone apps</text>
  <rect x="12" y="210" width="124" height="34" rx="17" class="chip" style="stroke:#4CADAD"/>
  <text x="74" y="231" text-anchor="middle" class="c">Mail clients</text>

  <!-- legend -->
  <line x1="14" y1="452" x2="40" y2="452" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="48" y="456" class="l">photo backup</text>
  <line x1="14" y1="474" x2="40" y2="474" stroke="#8b9bb0" stroke-width="1.6"/>
  <text x="48" y="478" class="l">web traffic</text>
  <line x1="14" y1="496" x2="40" y2="496" stroke="#4CADAD" stroke-width="1.8"/>
  <text x="48" y="500" class="l">mail</text>
  <line x1="14" y1="518" x2="40" y2="518" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="48" y="522" class="l">WireGuard</text>

  <!-- ── VPS ──────────────────────────────────────────────── -->
  <rect x="165" y="20" width="390" height="520" rx="14" fill="rgba(22,163,74,.05)" stroke="#16a34a" stroke-opacity=".7"/>
  <text x="183" y="48" class="h mono">mx.sautter.dev</text>
  <text x="330" y="48" class="s">VPS · the only public entry point</text>

  <rect x="183" y="66" width="354" height="32" rx="8" fill="rgba(225,29,72,.12)" stroke="#e11d48" stroke-opacity=".6"/>
  <text x="360" y="86" text-anchor="middle" class="c">fail2ban · own filters · regular log reviews</text>

  <rect x="183" y="112" width="354" height="54" rx="10" class="node"/>
  <text x="360" y="135" text-anchor="middle" class="t mono">sniproxy</text>
  <text x="360" y="154" text-anchor="middle" class="s">routes :443 by TLS SNI, without decrypting</text>

  <rect x="183" y="196" width="167" height="62" rx="10" class="node" style="stroke:#4CADAD"/>
  <text x="266" y="221" text-anchor="middle" class="t mono">Stalwart</text>
  <text x="266" y="240" text-anchor="middle" class="s">mail · SMTP IMAP JMAP</text>

  <rect x="370" y="196" width="167" height="62" rx="10" class="node"/>
  <text x="453" y="221" text-anchor="middle" class="t mono">nginx-proxy</text>
  <text x="453" y="240" text-anchor="middle" class="s">TLS · Let's Encrypt</text>

  <!-- local containers -->
  <rect x="183" y="295" width="167" height="225" rx="10" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.14)"/>
  <text x="266" y="318" text-anchor="middle" class="t mono">Local apps</text>
  <g>
    <rect x="195" y="332" width="143" height="24" rx="12" class="chip"/><text x="266" y="348" text-anchor="middle" class="c">sautter.dev</text>
    <rect x="195" y="362" width="143" height="24" rx="12" class="chip"/><text x="266" y="378" text-anchor="middle" class="c">Webmail</text>
    <rect x="195" y="392" width="143" height="24" rx="12" class="chip" style="stroke:#a78bfa"/><text x="266" y="408" text-anchor="middle" class="c">Headscale</text>
    <rect x="195" y="422" width="143" height="24" rx="12" class="chip"/><text x="266" y="438" text-anchor="middle" class="c">Pi-hole · DoH</text>
    <rect x="195" y="452" width="143" height="24" rx="12" class="chip"/><text x="266" y="468" text-anchor="middle" class="c">Dawarich</text>
    <rect x="195" y="482" width="143" height="24" rx="12" class="chip"/><text x="266" y="498" text-anchor="middle" class="c">Client websites</text>
  </g>

  <!-- tailscale gateway -->
  <rect x="370" y="295" width="167" height="70" rx="10" class="node" style="stroke:#a78bfa"/>
  <text x="453" y="323" text-anchor="middle" class="t mono">Tailscale gateway</text>
  <text x="453" y="343" text-anchor="middle" class="s">nginx inside a tailnet node</text>

  <rect x="370" y="385" width="167" height="135" rx="10" fill="none" stroke="rgba(167,139,250,.45)" stroke-dasharray="4 4"/>
  <text class="s">
    <tspan x="384" y="410">Own control plane:</tspan>
    <tspan x="384" y="428">Headscale hands out</tspan>
    <tspan x="384" y="446">the keys, no account</tspan>
    <tspan x="384" y="464">at tailscale.com.</tspan>
    <tspan x="384" y="488">Traffic flows directly</tspan>
    <tspan x="384" y="506">over WireGuard.</tspan>
  </text>

  <!-- ── Home lab ─────────────────────────────────────────── -->
  <rect x="625" y="20" width="365" height="520" rx="14" fill="rgba(132,179,220,.05)" stroke="#84b3dc" stroke-opacity=".7"/>
  <text x="643" y="48" class="h mono">Home lab</text>
  <text x="735" y="48" class="s">reachable only through the tailnet</text>

  <rect x="643" y="66" width="329" height="104" rx="10" class="node" style="stroke:#f472b6"/>
  <text x="657" y="90" class="t mono">Private AI <tspan class="s" font-weight="400">· not public</tspan></text>
  <text class="s">
    <tspan x="657" y="112">wake-on-llama proxy → Wake-on-LAN</tspan>
    <tspan x="657" y="130">GPU workstation sleeps until needed</tspan>
    <tspan x="657" y="148">llama.cpp · Hermes agents · SearXNG</tspan>
  </text>

  <rect x="643" y="190" width="329" height="190" rx="10" fill="rgba(167,139,250,.06)" stroke="#a78bfa" stroke-opacity=".6"/>
  <text x="657" y="213" class="s">Apps, each with its own Tailscale sidecar</text>
  <g>
    <rect x="655" y="226" width="150" height="28" rx="14" class="chip"/><circle cx="671" cy="240" r="4" fill="#a78bfa"/><text x="736" y="244" text-anchor="middle" class="c">Nextcloud</text>
    <rect x="810" y="226" width="150" height="28" rx="14" class="chip"/><circle cx="826" cy="240" r="4" fill="#a78bfa"/><text x="891" y="244" text-anchor="middle" class="c">Matrix</text>
    <rect x="655" y="262" width="150" height="28" rx="14" class="chip"/><circle cx="671" cy="276" r="4" fill="#a78bfa"/><text x="736" y="280" text-anchor="middle" class="c">Paperless</text>
    <rect x="810" y="262" width="150" height="28" rx="14" class="chip"/><circle cx="826" cy="276" r="4" fill="#a78bfa"/><text x="891" y="280" text-anchor="middle" class="c">Mealie</text>
    <rect x="655" y="298" width="150" height="28" rx="14" class="chip"/><circle cx="671" cy="312" r="4" fill="#a78bfa"/><text x="736" y="316" text-anchor="middle" class="c">Actual Budget</text>
    <rect x="810" y="298" width="150" height="28" rx="14" class="chip"/><circle cx="826" cy="312" r="4" fill="#a78bfa"/><text x="891" y="316" text-anchor="middle" class="c">Donetick</text>
    <rect x="655" y="334" width="150" height="28" rx="14" class="chip" style="stroke:#f59e0b;fill:rgba(245,158,11,.12)"/><circle cx="671" cy="348" r="4" fill="#a78bfa"/><text x="736" y="352" text-anchor="middle" class="c">Immich</text>
    <rect x="810" y="334" width="150" height="28" rx="14" class="chip"/><circle cx="826" cy="348" r="4" fill="#a78bfa"/><text x="891" y="352" text-anchor="middle" class="c">ntfy</text>
  </g>

  <rect x="643" y="400" width="329" height="120" rx="10" class="node" style="stroke:#f59e0b"/>
  <text x="657" y="424" class="t mono">restic <tspan class="s" font-weight="400">· every night at 03:00</tspan></text>
  <text class="s">
    <tspan x="657" y="446">Immich DB dump + photos + archive</tspan>
    <tspan x="657" y="464">→ separate backup disk</tspan>
    <tspan x="657" y="482">keeps 7 daily · 4 weekly · 12 monthly</tspan>
    <tspan x="657" y="500">integrity check after every run</tspan>
  </text>

  <!-- ── Connections ──────────────────────────────────────── -->
  <path d="M136 127 L183 136" class="ln"/>
  <path d="M136 169 L183 150" class="ln-amber"/>
  <path d="M136 227 L183 227" class="ln-teal"/>

  <path d="M266 166 V194" class="ln"/>
  <text x="276" y="184" class="l">SNI mx.sautter.dev</text>
  <path d="M453 166 V194" class="ln-amber"/>
  <text x="463" y="184" class="l">all other hosts</text>

  <path d="M400 258 V276 H266 V293" class="ln"/>
  <path d="M453 258 V293" class="ln-amber"/>

  <path d="M537 348 H653" fill="none" stroke="#a78bfa" stroke-width="6" stroke-opacity=".25"/>
  <path d="M537 348 H653" class="ln-amber" stroke-dasharray="6 4"/>
  <text x="590" y="338" text-anchor="middle" class="l mono" style="fill:#a78bfa">WireGuard</text>

  <path d="M730 362 V398" class="ln-amber"/>

  <!-- ── Photo backup path badges ─────────────────────────── -->
  <g>
    <circle cx="132" cy="154" r="9" fill="#f59e0b"/><text x="132" y="158" text-anchor="middle" class="b">1</text>
    <circle cx="533" cy="114" r="9" fill="#f59e0b"/><text x="533" y="118" text-anchor="middle" class="b">2</text>
    <circle cx="533" cy="198" r="9" fill="#f59e0b"/><text x="533" y="202" text-anchor="middle" class="b">3</text>
    <circle cx="533" cy="297" r="9" fill="#f59e0b"/><text x="533" y="301" text-anchor="middle" class="b">4</text>
    <circle cx="801" cy="336" r="9" fill="#f59e0b"/><text x="801" y="340" text-anchor="middle" class="b">5</text>
    <circle cx="968" cy="402" r="9" fill="#f59e0b"/><text x="968" y="406" text-anchor="middle" class="b">6</text>
  </g>
</svg>
