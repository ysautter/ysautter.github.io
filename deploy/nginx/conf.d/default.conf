server_tokens off;

# nginx-proxy in front already logs every request (journald, max. 3 months).
# No second copy here, so the retention stated in datenschutz.html holds.
access_log off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

# www -> apex. Fixed target (no $host) so this cannot become an open redirect.
server {
    listen 8080;
    server_name www.sautter.dev;
    return 301 https://sautter.dev$request_uri;
}

server {
    listen 8080 default_server;
    server_name sautter.dev;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    include /etc/nginx/snippets/security-headers.conf;

    # Matrix client discovery for @...:sautter.dev (homeserver matrix.sautter.dev)
    location = /.well-known/matrix/client {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
